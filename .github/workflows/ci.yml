name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # a hung test file would otherwise hold the job for the six-hour default
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # the two Node lines still in support: 20 reached end of life in April 2026
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # also exercises the prepare script, which is what builds dist/
      - run: npm ci

      - run: npm test

  relay:
    name: relay (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # the relay depends on the CLI package by path, so that is built first
      - run: npm ci
      - run: npm ci
        working-directory: relay
      - run: npm test
        working-directory: relay

  image:
    name: relay image boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t mcpbridge-relay .
      - name: the container answers /healthz
        run: |
          docker run -d --name relay -p 8080:8080 -e SESSION_SECRET=ci-only mcpbridge-relay
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/healthz | grep -q '"ok":true'
          docker logs relay

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # dist/ is generated and gitignored, so a build that does not run on pack ships a
      # package with no entry point. This fails loudly instead.
      - name: the tarball must contain the entry point
        run: |
          npm pack --silent
          tarball=$(ls ./*.tgz)
          echo "packed $tarball"
          tar tzf "$tarball"
          tar tzf "$tarball" | grep -q 'package/dist/index.js'

      - name: the entry point must be executable by node
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm i --silent "$GITHUB_WORKSPACE"/*.tgz
          ./node_modules/.bin/mcpbridge --help
