name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor declared in engines; 22 is what development happens on
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # also exercises the prepare script, which is what builds dist/
      - run: npm ci

      - run: npm test

  package:
    name: package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # dist/ is generated and gitignored, so a build that does not run on pack ships a
      # package with no entry point. This fails loudly instead.
      - name: the tarball must contain the entry point
        run: |
          npm pack --silent
          tarball=$(ls ./*.tgz)
          echo "packed $tarball"
          tar tzf "$tarball"
          tar tzf "$tarball" | grep -q 'package/dist/index.js'

      - name: the entry point must be executable by node
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm i --silent "$GITHUB_WORKSPACE"/*.tgz
          ./node_modules/.bin/mcpbridge --help
