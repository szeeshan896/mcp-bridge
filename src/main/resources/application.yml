spring:
  application:
    name: mcp-bridge

  ai:
    mcp:
      server:
        name: mcp-bridge
        version: 0.1.0
        # streamable HTTP, not stdio: one long-running process you connect once and
        # forget, rather than a fresh copy spawned per client
        protocol: streamable
        # a delegated task runs a real model; the 20s default would cut it off
        request-timeout: 600s
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        instructions: |
          MCP Bridge delegates work to other AI agents installed on this machine.
          Call list_agents to see who is available and installed, then ask_agent to hand
          one of them a task and get its answer back in a single call. Write prompts that
          stand on their own: the other agent cannot see this conversation, and needs
          workingDirectory to see project files.

server:
  port: 8080

mcp-bridge:
  # Output longer than this is truncated so one verbose agent cannot flood the
  # calling model's context.
  max-output-chars: 60000

  # Every command here is an allowlist entry. A tool call picks an agent by name; it can
  # never supply a command of its own. Verify these flags against the versions you have
  # installed -- list_agents reports which executables were actually found on PATH.
  agents:
    claude:
      description: "Claude Code - strong at refactoring, tests and reading large codebases"
      command: ["claude", "-p", "{prompt}"]
      timeout: 5m
    codex:
      description: "OpenAI Codex CLI - strong at algorithms and single-file problems"
      command: ["codex", "exec", "{prompt}"]
      timeout: 5m
    gemini:
      description: "Google Gemini CLI - large context, good for whole-repo questions"
      command: ["gemini", "-p", "{prompt}"]
      timeout: 5m
